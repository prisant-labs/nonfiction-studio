name: Tier B

# Manual only: runs when dispatched from the Actions tab, never on its own.
# The push-to-main and nightly cron triggers were removed so this workflow does
# not demand a credential GitHub does not yet have. Restore them once a secret
# is set and unattended coverage is wanted. Advisory either way: a Tier B
# failure never blocks a merge, though it still hard-blocks a release.
#
# A live run needs a credential ONLY on a GitHub runner, which has no logged-in
# user. Run locally instead with `node scripts/run-integration.mjs`, which
# spawns the claude CLI against your existing login and needs no API key.
# Zero validation logic lives in this file. Every step is exactly one node call.
# See Q-02 (CI pipeline) section 2 for the contract and failure taxonomy.
#
# Local proof: node scripts/run-integration.mjs --dry-run runs green locally
# per TSK-056 (Tier B integration and eval files). Live run deferred to first CI
# execution where ANTHROPIC_API_KEY is available.

on:
  workflow_dispatch:

jobs:
  tier-b:
    name: Tier B (model integration)
    runs-on: ubuntu-latest

    steps:
      # Inert scaffolding: required by GitHub Actions; no local equivalent.
      - name: Checkout
        uses: actions/checkout@v5

      # Inert scaffolding: pins Node.js to the engines floor declared in package.json.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      # Live step 1: clean install from lockfile.
      - name: Install dependencies
        run: npm ci

      # Inert scaffolding: installs the claude binary required by live steps 2
      # and 3 below. The npm package is the same binary as the standalone
      # installer and needs Node 22+, which the setup-node step above already
      # pins.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # Live step 2: model integration smoke test against examples/sample-book/
      # with the haiku model. Exits 1 if a model-call outcome or structural
      # assertion fails anywhere in the five-step flow, 2 on an operational
      # error (clone or CLI), 3 on BUDGET_EXCEEDED (cap sized for one full run;
      # spend > $1.00).
      - name: Model integration
        run: node scripts/run-integration.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Live step 3: eval dispatch-accuracy batch runner. Real exit contract
      # (scripts/run-evals.mjs's own taxonomy): 0 once every case has been
      # graded, whatever the pass rate - dispatch accuracy is advisory signal
      # only and does not affect the exit code; 1 if an evals/*.eval.json file
      # is malformed; 2 if no model access is available; 3 only on a genuine
      # BUDGET_EXCEEDED (cap sized for the full 28-case batch; see the script).
      # This tier is advisory because the trigger above is workflow_dispatch
      # only, not because any step here suppresses a nonzero exit - there is
      # no continue-on-error in this file.
      - name: Eval dispatch accuracy
        run: node scripts/run-evals.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
