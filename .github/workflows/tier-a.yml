name: Tier A

# Runs on every pull request targeting main.
# Both OS legs must be green; a failure on one is a real cross-platform bug.
# Zero validation logic lives in this file. Every step is exactly one node or claude call.
# See Q-02 (CI pipeline) sections 1.1 and 6 for the contract and local parity rules.
#
# Local proof: all nine original steps run green on Windows per TSK-055 (Tier A
# check scripts); the three inventory, self-sufficiency, and plugin-root gates
# added below (Wave 0 hardening) were verified locally in the same run.
# The ubuntu leg proves on first push. The claude binary is not present on standard
# GitHub Actions runners, so it is installed by an inert scaffolding step ahead of
# live step 3; that step's availability on both runners proves on the first PR.

on:
  pull_request:
    branches:
      - main

jobs:
  tier-a:
    name: Tier A (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # Inert scaffolding: required by GitHub Actions; no local equivalent.
      - name: Checkout
        uses: actions/checkout@v5

      # Inert scaffolding: pins Node.js to the engines floor declared in package.json.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      # Live step 1: clean install from lockfile per D-04 (Node everywhere).
      - name: Install dependencies
        run: npm ci

      # Live step 2: Bronze spine conformance check, plain-plugin profile (Standard 0.12).
      - name: Spine conformance
        run: node scripts/check.mjs --profile plain-plugin

      # Inert scaffolding: installs the claude binary required by live step 3.
      # The npm package is the same binary as the standalone installer and needs
      # Node 22+, which the setup-node step above already pins.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # Live step 3: platform schema validation via claude CLI.
      # Reads the authored manifests in .claude-plugin/ only, per ADR-0006
      # (manifest authority split); no API key or account auth is involved.
      - name: Platform validation
        run: claude plugin validate --strict .

      # Live step 4: hooks.json schema and script-existence check.
      - name: Hooks schema
        run: node scripts/check-hooks-schema.mjs

      # Live step 5: agent and skill frontmatter validation with S4 chain enforcement.
      - name: Frontmatter completeness
        run: node scripts/check-frontmatter.mjs

      # Live step 6: docs/reference/ coverage gate (D-24 docs release gate).
      - name: Docs completeness
        run: node scripts/check-docs-completeness.mjs

      # Live step 7: relative link check across docs/ and repo root .md files.
      - name: Link check
        run: node scripts/check-links.mjs

      # Live step 8: plugin-root invocation convention check (F-SK-01, F-ST-01).
      - name: Plugin root convention
        run: node scripts/checks/check-plugin-root.mjs

      # Live step 9: no-additional-keys self-sufficiency guard.
      - name: Self-sufficiency
        run: node scripts/check-self-sufficiency.mjs

      # Live step 10: component inventory equality and manifest name-equality check (F-ST-03, F-ST-04).
      - name: Component inventory
        run: node scripts/checks/check-inventory.mjs

      # Live step 11: workspace-reference guard - a shipped file must not point at a path that
      # does not survive a clean checkout (this wave's own scratch workspace included).
      - name: Workspace reference guard
        run: node scripts/checks/check-workspace-refs.mjs

      # Live step 12: shipped-Markdown CLI routing-target resolution check (F-CI-07) - asserts
      # every bin/ns-<name> a shipped document names as a routing target is actually shipped
      # under bin/, across agents/, docs/, examples/, skills/, templates/, and root-level .md
      # files (excluding docs/adr/ and docs/gates/, dated historical records - see the
      # checker's own header for the exemption). This step is this checker's only proof of its
      # git-tracked code path: the Checkout action above leaves .git present, exactly like the
      # plugin-root, self-sufficiency, inventory, and workspace-reference steps above it; the
      # test suite exercises only the degraded filesystem-walk fallback, by design, since its
      # fixtures never carry .git.
      - name: Skill CLI routing targets
        run: node scripts/checks/check-skill-cli-targets.mjs

      # Live step 13: advertised-invocation resolution check (PF-09 remedy, F-CI-07's remaining
      # half) - asserts every "/nonfiction-studio:<name>" a shipped document advertises actually
      # resolves to a shipped skill directory, across agents/, docs/, examples/, skills/,
      # templates/, and root-level .md files (excluding docs/adr/ and docs/gates/, dated
      # historical records - see the checker's own header for the exemption). Same git-tracked
      # coverage rationale as the "Skill CLI routing targets" step above it.
      - name: Advertised invocations
        run: node scripts/checks/check-advertised-invocations.mjs

      # Live step 14: component-count claim checker - derives the true CLI and skill counts from
      # the tree at run time and fails on a stale prose claim about either total. This step is
      # this checker's only proof of its git-tracked code path, the same reason steps 12 and 13
      # above exist on their own: the Checkout action leaves .git present, exactly like every
      # standalone checker step above it; the test suite exercises the degraded filesystem-walk
      # fallback separately, by design, since its from-scratch fixtures never carry .git.
      - name: Component count claims
        run: node scripts/checks/check-component-counts.mjs

      # Live step 15: engine, lib, hook, and schema unit test suites (no API key required).
      - name: Engine unit tests
        run: node scripts/test-engines.mjs

      # Live step 16: bidirectional fixture matrix with temp-clone discipline.
      - name: Fixture tests
        run: node scripts/test-fixtures.mjs

      # Live step 17: sample book integrity - verifies resolution through marker-to-ledger-to-SRC chains.
      - name: Sample book integrity
        run: node scripts/verify-sample-book.mjs
