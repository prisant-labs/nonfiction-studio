name: Feature request
description: Suggest something Nonfiction Studio does not do yet.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Nonfiction Studio is a solo-maintained, pre-release plugin, so
        not every good idea lands quickly - but a clear, concrete request is easy to weigh.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that the plugin does not currently support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the plugin do instead? A new skill, a change to an existing one, a new CLI flag, and so on.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other way you have worked around this, or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help - an example project, a related issue, a screenshot.
    validations:
      required: false
